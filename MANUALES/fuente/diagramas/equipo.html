<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#fff}
body{font-family:Arial,Helvetica,sans-serif;color:#111}
#hoja{width:1500px;padding:24px 28px 28px;box-sizing:border-box}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:6px}
th,td{border:1px solid #111;padding:5px 8px;text-align:left}
th{font-weight:bold;background:#fff}
td.n,th.n{text-align:center;width:34px}
</style></head><body><div id="hoja">
<svg id="dib" width="1444" height="660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"></svg>
<table id="tabla"></table>
</div>
<script>
// Dibujo isométrico del IoT DOG (medidas aproximadas en mm). ?tabla=0 lo dibuja sin la tabla.
const L = 200, W = 110, H = 80, HF = 45, PL = 50;   // largo, ancho, alto, alto del frente, largo de la pendiente
const S = 2.15, C = Math.cos(Math.PI / 6);
const svg = document.getElementById('dib');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, at, padre = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  padre.appendChild(e); return e;
}

// Proyección isométrica; la vista 2 es la misma pieza girada 180°
function vista(ox, oy, girada) {
  const P = p => {
    let [x, y, z] = p;
    if (girada) { x = L - x; y = W - y; }
    return [ox + (x - y) * C * S, oy + ((x + y) * 0.5 - z) * S];
  };
  const vis = n => {
    let [a, b, c] = n; if (girada) { a = -a; b = -b; }
    return a + b + c > 0;
  };
  return { P, vis };
}

const pts = (V, arr) => arr.map(p => V.P(p).map(v => v.toFixed(1)).join(',')).join(' ');
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];

// Figuras sobre una cara plana: centro c, ejes u y v
function rect(V, c, u, v, a, b, at) {
  const q = [[-a, -b], [a, -b], [a, b], [-a, b]].map(([i, j]) => add(add(c, u, i), v, j));
  return el('polygon', Object.assign({ points: pts(V, q) }, at));
}
function circ(V, c, u, v, r, at) {
  const q = []; for (let i = 0; i < 40; i++) { const t = i / 40 * 2 * Math.PI; q.push(add(add(c, u, r * Math.cos(t)), v, r * Math.sin(t))); }
  return el('polygon', Object.assign({ points: pts(V, q) }, at));
}
function linea(V, a, b, at) { const [x1, y1] = V.P(a), [x2, y2] = V.P(b); return el('line', Object.assign({ x1, y1, x2, y2 }, at)); }

const TRAZO = { stroke: '#111', 'stroke-width': 1.3, 'stroke-linejoin': 'round' };
const FINO = { stroke: '#111', 'stroke-width': 0.9, fill: 'none' };

// Caras de la carcasa (prisma con el perfil del costado)
const perfil = [[0, 0], [L, 0], [L, HF], [L - PL, H], [0, H]];   // (x, z)
const ds = Math.hypot(PL, H - HF);
const pend = [PL / ds, 0, -(H - HF) / ds];   // dirección pendiente abajo
const ejes = {
  arriba: { u: [1, 0, 0], v: [0, 1, 0] },
  frente: { u: [0, 1, 0], v: [0, 0, 1] },
  atras: { u: [0, -1, 0], v: [0, 0, 1] },
  lado: { u: [1, 0, 0], v: [0, 0, 1] },
  pendiente: { u: pend, v: [0, 1, 0] },
};

function carcasa(V) {
  const caras = [
    { n: [0, 1, 0], q: perfil.map(([x, z]) => [x, W, z]), f: '#ffffff' },
    { n: [0, -1, 0], q: perfil.map(([x, z]) => [x, 0, z]), f: '#ffffff' },
    { n: [1, 0, 0], q: [[L, 0, 0], [L, W, 0], [L, W, HF], [L, 0, HF]], f: '#e9e9e9' },
    { n: [-1, 0, 0], q: [[0, 0, 0], [0, W, 0], [0, W, H], [0, 0, H]], f: '#e9e9e9' },
    { n: [0, 0, 1], q: [[0, 0, H], [L - PL, 0, H], [L - PL, W, H], [0, W, H]], f: '#f6f6f6' },
    { n: [H - HF, 0, PL], q: [[L - PL, 0, H], [L, 0, HF], [L, W, HF], [L - PL, W, H]], f: '#f0f0f0' },
  ];
  for (const c of caras) if (V.vis(c.n)) el('polygon', Object.assign({ points: pts(V, c.q), fill: c.f }, TRAZO));
}

// Ancla de cada globo: punto 3D del componente
const anclas = {};
function ancla(n, V, p) { anclas[n] = V.P(p); }

// ---------- VISTA FRONTAL ----------
const V1 = vista(330, 245, false);
carcasa(V1);
{
  const V = V1, { u, v } = ejes.pendiente;
  const c = add([L - PL, W / 2, H], u, ds / 2);
  rect(V, c, u, v, 17, 43, Object.assign({ fill: '#fff' }, TRAZO));                       // marco de la pantalla
  rect(V, c, u, v, 9.5, 34, { fill: '#d4d4d4', stroke: '#111', 'stroke-width': 1 });      // vidrio
  for (const [i, j] of [[-13, -39], [-13, 39], [13, -39], [13, 39]]) circ(V, add(add(c, u, i), v, j), u, v, 1.6, FINO);
  ancla(1, V, add(c, v, 12));
}
{
  const V = V1, { u, v } = ejes.arriba;
  // LEDs
  circ(V, [L - PL - 14, 18, H], u, v, 4.2, Object.assign({ fill: '#fff' }, TRAZO));
  circ(V, [L - PL - 14, 18, H], u, v, 2.4, { fill: '#cfcfcf', stroke: '#111', 'stroke-width': 0.8 });
  circ(V, [L - PL - 14, 34, H], u, v, 4.2, Object.assign({ fill: '#fff' }, TRAZO));
  circ(V, [L - PL - 14, 34, H], u, v, 2.4, { fill: '#cfcfcf', stroke: '#111', 'stroke-width': 0.8 });
  ancla(2, V, [L - PL - 14, 18, H]); ancla(3, V, [L - PL - 14, 34, H]);
  // 5 botones
  for (let i = 0; i < 5; i++) {
    const cb = [L - PL - 38, 18 + i * 18.5, H];
    rect(V, cb, u, v, 6, 6, Object.assign({ fill: '#fff' }, TRAZO));
    circ(V, cb, u, v, 3.6, { fill: '#e2e2e2', stroke: '#111', 'stroke-width': 0.9 });
  }
  ancla(9, V, [L - PL - 38, 18, H]);
  // Rejilla del sensor de gas (MQ-2)
  const cg = [62, 34, H];
  circ(V, cg, u, v, 13, Object.assign({ fill: '#fff' }, TRAZO));
  circ(V, cg, u, v, 10, { fill: '#e6e6e6', stroke: '#111', 'stroke-width': 0.9 });
  for (let i = -8; i <= 8; i += 4) for (let j = -8; j <= 8; j += 4) if (i * i + j * j < 70) circ(V, add(add(cg, u, i), v, j), u, v, 1.1, { fill: '#111' });
  ancla(5, V, add(cg, u, -4));
  // Sensor de luz (LDR)
  const cl = [62, 82, H];
  circ(V, cl, u, v, 5.5, Object.assign({ fill: '#fff' }, TRAZO));
  circ(V, cl, u, v, 3.2, { fill: '#cfcfcf', stroke: '#111', 'stroke-width': 0.9 });
  ancla(6, V, cl);
}
{
  const V = V1, { u, v } = ejes.frente;
  const cr = [L, W / 2, 22];   // ventana del radar
  rect(V, cr, u, v, 24, 8, Object.assign({ fill: '#fff' }, TRAZO));
  rect(V, cr, u, v, 20, 5, { fill: '#d4d4d4', stroke: '#111', 'stroke-width': 0.9 });
  ancla(7, V, add(cr, u, 10));
}
{
  const V = V1, { u, v } = ejes.lado;
  // Ranuras de ventilación del sensor de temperatura y humedad
  for (let i = 0; i < 6; i++) rect(V, [96 + i * 6, W, 40], u, v, 1.4, 11, { fill: '#555', stroke: '#111', 'stroke-width': 0.8 });
  ancla(4, V, [111, W, 34]);
}

// ---------- VISTA TRASERA ----------
const V2 = vista(1050, 245, true);
carcasa(V2);
{
  const V = V2, { u, v } = ejes.atras;
  // Bornera de 12 V
  const cb = [0, 24, 26];
  rect(V, cb, u, v, 13, 8, Object.assign({ fill: '#fff' }, TRAZO));
  for (const k of [-6, 6]) { circ(V, add(cb, u, k), u, v, 3.6, FINO); linea(V, add(add(cb, u, k - 2), v, 2), add(add(cb, u, k + 2), v, -2), FINO); }
  ancla(11, V, add(cb, u, 0));
  // Conector USB tipo B
  const cu = [0, 56, 26];
  rect(V, cu, u, v, 7, 6.5, Object.assign({ fill: '#fff' }, TRAZO));
  const q = [[-4.5, -4], [4.5, -4], [4.5, 2.2], [2.8, 4], [-2.8, 4], [-4.5, 2.2]].map(([i, j]) => add(add(cu, u, i), v, j));
  el('polygon', Object.assign({ points: pts(V, q), fill: '#d4d4d4', 'stroke-width': 0.9, stroke: '#111' }));
  ancla(12, V, cu);
  // Interruptor
  const ci = [0, 86, 50];
  rect(V, ci, u, v, 8, 11, Object.assign({ fill: '#fff' }, TRAZO));
  rect(V, add(ci, v, 4), u, v, 6, 5, { fill: '#e2e2e2', stroke: '#111', 'stroke-width': 0.9 });
  rect(V, add(ci, v, -4), u, v, 6, 5, { fill: '#bdbdbd', stroke: '#111', 'stroke-width': 0.9 });
  ancla(10, V, ci);
  // Placa del sensor de consumo (adentro, en línea de trazos)
  const ci2 = [70, 40, 8];
  const a = ejes.arriba;
  rect(V, ci2, a.u, a.v, 14, 16, { fill: 'none', stroke: '#111', 'stroke-width': 1, 'stroke-dasharray': '5 3' });
  ancla(8, V, add(ci2, a.u, 6));
}

// ---------- Globos ----------
const globos = {   // posición del número en pantalla
  1: [700, 300], 2: [690, 130], 3: [600, 70], 4: [120, 455], 5: [350, 45], 6: [190, 75],
  7: [650, 600], 9: [470, 35], 10: [1330, 300], 11: [1180, 610], 12: [1290, 600], 8: [880, 560],
};
for (const n in globos) {
  const [gx, gy] = globos[n], [ax, ay] = anclas[n];
  const d = Math.hypot(ax - gx, ay - gy), r = 15;
  el('line', { x1: gx + (ax - gx) / d * r, y1: gy + (ay - gy) / d * r, x2: ax, y2: ay, stroke: '#111', 'stroke-width': 1 });
  el('circle', { cx: ax, cy: ay, r: 2.4, fill: '#111' });
  el('circle', { cx: gx, cy: gy, r, fill: '#fff', stroke: '#111', 'stroke-width': 1.3 });
  el('text', { x: gx, y: gy + 5.5, 'text-anchor': 'middle', 'font-size': 15 }).textContent = n;
}
const rotulo = (x, t) => { el('text', { x, y: 645, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 'bold' }).textContent = t; };
rotulo(330, 'VISTA FRONTAL'); rotulo(1050, 'VISTA TRASERA');
el('text', { x: 1050, y: 662 - 0, 'text-anchor': 'middle', 'font-size': 12 }).textContent = '';
el('line', { x1: 722, y1: 20, x2: 722, y2: 640, stroke: '#111', 'stroke-width': 0.6, 'stroke-dasharray': '2 4' });

// ---------- Tabla ----------
const partes = [
  ['Pantalla', 'Muestra las conexiones y las mediciones'],
  ['Luz LED1', 'Prendida = todo bien'],
  ['Luz LED2', 'Prendida = alarma'],
  ['Sensor de temperatura y humedad', 'Mide el calor y la humedad del aire'],
  ['Sensor de gas', 'Detecta gas y humo (se pone tibio, es normal)'],
  ['Sensor de luz', 'Mide cuánta luz hay'],
  ['Sensor de presencia', 'Detecta personas hasta a 6 m, aunque estén quietas'],
  ['Sensor de consumo (interno)', 'Mide cuánta corriente usa el equipo'],
  ['Botones 1 a 5', 'Todavía no hacen nada'],
  ['Interruptor', 'Prende y apaga el equipo'],
  ['Bornera de 12 V', 'Para conectar la fuente'],
  ['Conector USB', 'Para un cargador USB (en lugar de la fuente)'],
];
const tb = document.getElementById('tabla');
if (location.search.includes('tabla=0')) tb.remove();
else {
  let h = '<tr><th colspan="6" style="text-align:center">COMPONENTES DEL EQUIPO</th></tr><tr><th class="n">N°</th><th>Parte</th><th>Para qué sirve</th><th class="n">N°</th><th>Parte</th><th>Para qué sirve</th></tr>';
  for (let i = 0; i < 6; i++) {
    const a = partes[i], b = partes[i + 6];
    h += `<tr><td class="n">${i + 1}</td><td>${a[0]}</td><td>${a[1]}</td><td class="n">${i + 7}</td><td>${b[0]}</td><td>${b[1]}</td></tr>`;
  }
  tb.innerHTML = h;
}
</script></body></html>
